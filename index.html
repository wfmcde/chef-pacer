<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chef Pacer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased pb-12">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 sm:px-6">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-emerald-950/40">
          <i data-lucide="flame" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white leading-tight">Chef Pacer</h1>
          <p class="text-[11px] font-medium text-emerald-400">Culinary Itinerary Hub</p>
        </div>
      </div>
      <span id="recipeCount" class="text-xs font-mono text-slate-400 bg-slate-950 px-2.5 py-1 rounded-md border border-slate-800"></span>
    </div>
  </header>

  <!-- RECIPE DIRECTORY -->
  <main class="max-w-2xl mx-auto w-full px-4 sm:px-6 pt-6 flex-1 flex flex-col gap-4">
    <div>
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Select A Meal Itinerary</h2>
      <p class="text-sm text-slate-300">Choose a recipe to launch its single-threaded kitchen guide and timers.</p>
    </div>

    <!-- DYNAMIC CONTAINER -->
    <div id="recipeCardsContainer" class="flex flex-col gap-4"></div>
  </main>

  <script>
    // =========================================================================
    // RECIPES CATALOG
    // To add a new meal, just paste 6 lines here:
    // =========================================================================
    const recipes = [
      {
        title: "Thick Pork Chops & Mushroom Ravioli",
        tag: "Grill & Pasta",
        desc: "Gotham Greens Vegan Pesto, upright fat-rendering on a two-zone fire, and resting-timed pasta boil.",
        time: "Est. 28 min",
        legs: "5 Legs",
        file: "grilled-pork-chops-pesto.html"
      },
      {
        title: "Pork Chops in Rustic Calabrian Sugo",
        tag: "Skillet Braise & Rigatoni",
        desc: "San Marzano tomatoes, cremini mushrooms, slow Dutch oven braise, and rigatoni tossed in pan sauce.",
        time: "Est. 45 min",
        legs: "5 Legs",
        file: "braised-pork-chops-sugo.html"
      },
      {
        title: "Pan-Seared Shrimp & Scallop Pasta with Heirloom Tomatoes",
        tag: "Skillet Seafood & Pasta",
        desc: "Seared seafood, golden cremini mushrooms, burst heirloom tomatoes, and pasta tossed in glossy pesto.",
        time: "Est. 22 min",
        legs: "5 Legs",
        file: "shrimp-scallop-heirloom-pasta.html"
      }
    ];

    // --- AUTO-RENDER CARDS ---
    document.getElementById("recipeCount").textContent = `${recipes.length} Recipes`;
    const container = document.getElementById("recipeCardsContainer");

    container.innerHTML = recipes.map(r => `
      <a href="${r.file}" class="group block bg-slate-900 border border-slate-800 hover:border-emerald-500/60 rounded-2xl p-5 transition-all shadow-sm hover:shadow-lg hover:shadow-emerald-950/30">
        <div class="flex items-start justify-between gap-3">
          <div>
            <span class="inline-block text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-2">
              ${r.tag}
            </span>
            <h3 class="text-lg font-bold text-white group-hover:text-emerald-300 transition-colors">
              ${r.title}
            </h3>
            <p class="text-xs text-slate-400 mt-1 leading-relaxed">
              ${r.desc}
            </p>
          </div>
          <div class="w-8 h-8 rounded-full bg-slate-800 group-hover:bg-emerald-500 group-hover:text-white flex items-center justify-center text-slate-400 transition-all shrink-0 mt-1">
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </div>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center gap-4 text-xs font-mono text-slate-400">
          <span class="flex items-center gap-1.5"><i data-lucide="clock" class="w-3.5 h-3.5 text-emerald-400"></i> ${r.time}</span>
          <span class="flex items-center gap-1.5"><i data-lucide="list-ordered" class="w-3.5 h-3.5 text-emerald-400"></i> ${r.legs}</span>
        </div>
      </a>
    `).join("");

    lucide.createIcons();
  </script>
</body>
</html>
